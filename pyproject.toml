[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "function-cnn"
version = "0.1.0"
description = "Multi-task CNN that classifies plotted 2D and 3D functions and detects their structural properties."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Raahim Nawaz" }]
keywords = ["pytorch", "cnn", "function-classification", "multi-task"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
demo = ["gradio>=4.0"]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.25",
    "nbformat>=5.9",
    "ruff>=0.4",
    "black>=24.0",
    "pytest>=7.4",
    "mypy>=1.6",
]

[project.scripts]
function-cnn-train = "src.train:main"

[project.urls]
Homepage = "https://github.com/raahimnawaz/func_class_-cnn"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
